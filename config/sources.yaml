# Source configuration. modes: automatic | manual | hybrid | disabled
#
# `reference_url` on each source is a human-browsable page a reviewer can open to independently
# verify the value the automatic collector pulled — shown in the UI's Responsibility Status page
# ("View evidence"). It is deliberately separate from the machine endpoint the collector actually
# calls (`automatic.url` etc.), which is often a raw API/data endpoint, not something a human
# would want to open in a browser.
#
# NOTE: home.investorsgroup.com, digital.lipperweb.com and *.sharepoint.com sources require the
# IG corporate VPN + authenticated session. Automatic collectors for these are fully implemented
# and attempted every run; outside the VPN expect them to fail fast with a real captured error
# (SOURCE_HTTP_TIMEOUT / SOURCE_AUTH_REQUIRED / a TLS error) and fall through to the next tier.
# Manual upload is the last resort, never the first choice — every automatic tier below is tried
# before a responsibility is marked MANUAL_REQUIRED.
#
# `browser_profile`, where set, names a persistent Playwright session (see
# collectors/browser_session.py and SECURITY.md) tried BEFORE the plain-HTTP tiers below. A real
# debug bundle proved home.investorsgroup.com redirects an unauthenticated request straight to
# Microsoft/Entra ID SSO — no plain-HTTP tuning gets past that; a saved session (created once via
# `cli browser-login --source <id>`, an interactive sign-in the user does themselves) is the only
# way. Purely additive and opt-in: if `cli browser-login` has never been run for a profile, every
# collector below behaves exactly as if this line weren't here.

sources:
  template:
    enabled: true
    mode: automatic
    automatic:
      type: local_file
      timeout_seconds: 5
    manual:
      allowed_types: [xlsx]
    freshness:
      maximum_age_days: 3650

  report_date:
    enabled: true
    mode: automatic
    automatic:
      type: user_input
    manual:
      allowed_types: [numeric]
    freshness:
      maximum_age_days: 0

  gic_rates:
    enabled: true
    mode: hybrid
    automatic:
      type: web_then_file_watch
      # Tier 1: the public GIC product page — scraped fresh every run for whatever rates-file
      # link is currently on it, since that link can change over time.
      # Tier 2 (fallback only): the SharePoint direct link from Step by Step Cash And
      # Equivalents.docx ("Mike's Folder") — a "Copy Link" share URL with an embedded access
      # token (see the ?d=...&e=... below) that can expire/rotate independent of the file itself,
      # so it's a fast-path backup, not the primary source. Tier 3 (below): file_watch folder.
      # Tier 4: source_material/ historical-demo fixture.
      sharepoint_url: "https://446346262425.sharepoint.com/:x:/r/teams/IG-Portfolio-Strategist/Shared%20Documents/Cash%20and%20equivalents/Mike%27s%20Folder/GIC%20Rates.xlsx?d=w3963642ba08c4bae8190dad1a4ae884a&csf=1&web=1&e=pcDvdc"
      product_page_url: "https://home.investorsgroup.com/Content/en/products/pr/gic-tca.shtml"
      browser_profile: "igm_default"
      folder: "local_data/uploads/gic_rates"
      timeout_seconds: 15
      retries: 0
    manual:
      allowed_types: [xlsx, csv]
    freshness:
      maximum_age_days: 14
    reference_url: "https://home.investorsgroup.com/Content/en/products/pr/gic-tca.shtml"

  canada_prime:
    enabled: true
    mode: hybrid
    automatic:
      type: official_http
      # Bank of Canada Valet API, series V80691311 (Canadian bank prime rate)
      url: "https://www.bankofcanada.ca/valet/observations/V80691311/json?recent=5"
      timeout_seconds: 20
      retries: 2
    manual:
      allowed_types: [numeric]
    freshness:
      maximum_age_days: 14
    reference_url: "https://www.bankofcanada.ca/rates/interest-rates/canadian-interest-rates/"

  us_fed_funds:
    enabled: true
    mode: hybrid
    automatic:
      type: official_http
      # FRED (Federal Reserve Bank of St. Louis) - Federal Funds target range bounds
      url_upper: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFEDTARU"
      url_lower: "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DFEDTARL"
      timeout_seconds: 20
      retries: 2
      rule: "UPPER_BOUND"
      rule_status: "UNCONFIRMED_BUSINESS_RULE"
    manual:
      allowed_types: [numeric]
    freshness:
      maximum_age_days: 14
    reference_url: "https://fred.stlouisfed.org/series/DFEDTARU"
    reference_url_lower: "https://fred.stlouisfed.org/series/DFEDTARL"

  money_market:
    enabled: true
    mode: hybrid
    automatic:
      type: authenticated_http
      # Lipper fund profile pages, linked from Info.docx. Requires IG VPN + Lipper session.
      url_cad: "https://digital.lipperweb.com/invgrp/profile?symbol=68317397&lang=en"
      url_us: "https://digital.lipperweb.com/invgrp/profile?symbol=68002367&lang=en"
      # A real debug bundle showed this page returns genuine Lipper content (not a login
      # redirect) but with no percentage value anywhere in the raw server HTML — consistent with
      # the yield being populated client-side after load. browser_profile here renders the page
      # with JS executed instead of a raw GET; see money_market.py's collect_automatic docstring.
      browser_profile: "igm_default"
      timeout_seconds: 15
      retries: 1
    manual:
      allowed_types: [numeric]
    freshness:
      maximum_age_days: 14
    reference_url: "https://digital.lipperweb.com/invgrp/profile?symbol=68317397&lang=en"
    reference_url_us: "https://digital.lipperweb.com/invgrp/profile?symbol=68002367&lang=en"

  treasury_bills:
    enabled: true
    mode: hybrid
    automatic:
      type: http_then_file_watch
      # NBIN (National Bank Independent Network) — linked from Step by Step docx. Login-gated;
      # the live attempt is still made every run so the real failure reason (not just "we didn't
      # try") is captured and visible in the debug bundle, then falls through to file_watch.
      url: "https://www.nbin.ca/cmst/site/index.jhtml?navid=814"
      browser_profile: "igm_default"
      folder: "local_data/uploads/tbills"
      timeout_seconds: 15
      retries: 0
    manual:
      allowed_types: [pdf, txt]
    freshness:
      maximum_age_days: 14
    reference_url: "https://www.nbin.ca/cmst/site/index.jhtml?navid=814"

  hisa:
    enabled: true
    mode: hybrid
    automatic:
      type: authenticated_http
      # home.investorsgroup.com product pages, linked from Info.docx / Step by Step docx.
      # Requires IG VPN + authenticated session.
      url: "https://home.investorsgroup.com/Content/en/products/shortTrm/igEQBHighInterest.shtml"
      browser_profile: "igm_default"
      timeout_seconds: 15
      retries: 1
    manual:
      allowed_types: [csv, xlsx, pdf, structured]
    freshness:
      maximum_age_days: 14
    reference_url: "https://home.investorsgroup.com/Content/en/products/shortTrm/igEQBHighInterest.shtml"
