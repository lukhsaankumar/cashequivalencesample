[project]
name = "cash-equivalents-mvp"
version = "0.1.0"
description = "Local MVP for weekly Cash and Cash Equivalents EN/FR reporting"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "pandas>=2.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "PyYAML>=6.0",
    "python-dateutil>=2.9",
    "streamlit>=1.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "responses>=0.25",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
]
windows = ["pywin32>=306"]
# For corporate networks that do TLS/SSL inspection (a proxy re-signs HTTPS traffic with its own
# root CA) — install this if collectors fail with SOURCE_TLS_TRUST_FAILURE / "self-signed
# certificate in certificate chain". Patches Python to trust the OS certificate store (which
# already has the corporate root CA, via Group Policy) instead of only the bundled `certifi` list.
# See SECURITY.md.
corp-network = ["pip-system-certs>=4.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# The repo root also holds config/, docs/, source_material/, local_data/, tests/, scripts/ —
# none of those are Python packages, so auto-discovery must be told explicitly what to ship
# instead of guessing (it otherwise refuses to build at all, seeing multiple top-level dirs).
include = ["cash_equivalents_mvp*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# Scoped deliberately: F (pyflakes — real bugs like unused imports/names) and RUF (ruff-native
# checks) are broadly useful with low noise. Style-only families (E501 line length, B, SIM, UP)
# are left off rather than chasing them across the whole codebase in this pass — line-length is
# already a soft target via [tool.ruff] line-length, not a hard gate here.
select = ["F", "RUF", "BLE", "DTZ", "S", "PLW"]
ignore = [
    # Every responsibility's collect_automatic() and every parser deliberately catches
    # Exception at the boundary with an external library (openpyxl, httpx, docx, fitz) and
    # converts it into a structured ResponsibilityError — that's the whole point of the
    # responsibility interface (master prompt §12), not a bug to silence per call site.
    "BLE001",
    # This is a local single-operator desktop tool with no cross-timezone requirement;
    # datetime.utcnow()/date.today() are used consistently and intentionally throughout
    # rather than threading tz-aware datetimes through models that don't need them.
    "DTZ003", "DTZ011",
    # hisa.py's VPN-reachability probe is a deliberate best-effort connectivity check with a
    # documented inline comment explaining why failure is silently expected outside the VPN.
    "S110",
    # Stylistic-only, doctor's diagnostic print is clearer written as an explicit comparison.
    "UP036",
    # LibreOffice is invoked with a fixed, hardcoded argument list (soffice path from shutil.which
    # + constant flags + our own already-validated Path objects) — never shell=True, never
    # untrusted input concatenated into the command line.
    "S603",
]

[tool.pytest.ini_options]
markers = [
    "online: requires real network access, skipped by default",
]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
